# Keeps the app's own rate data out of anyone else's hands by never asking
# for it. Declaring nothing to sync is the configuration: Gradle must find the
# version catalog and the wrapper, which are both committed.
name: Dolita

on:
  push:
    branches: ["master", "main", "stabilize-release-readiness"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The wrapper is what pins Gradle 9.5.0. Installing Gradle from the
      # internet instead would mean CI tests a version nobody ships.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No .gitignore'd local.properties here on purpose. Gradle regenerates it
      # from ANDROID_HOME, and writing a stub with a hardcoded SDK path is how
      # CI starts failing on someone else's machine.
      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      # A debug APK is not a release: assembleRelease refuses to run without the
      # signing key, which is deliberately not in this repository and must never
      # be. This job can therefore never produce a shippable artifact.
      - name: Upload debug APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
